name: 每日 AI 报告：生成 + PDF + 邮件

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '7 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-ai-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 触发采集，并等新报告生成
        run: python scripts/trigger_run.py

      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 生成 PDF 并发送邮件
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/report_pdf.py
